<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cartas para você</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bg1:#ffd1e8;--bg2:#c9a7ff;--ink:#5a2a6e;--paper:#fff8fc;--env:#f7b6d8;--env2:#e79bc8;--accent:#c2358f;--nav:#ffffffcc;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#3b1550;--bg2:#1f0f3d;--ink:#4a2160;--nav:#ffffff22;color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#3b1550;--bg2:#1f0f3d;--ink:#4a2160;--nav:#ffffff22}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,var(--bg1),var(--bg2));font-family:'Playfair Display',Georgia,serif;overflow-x:hidden;display:flex;flex-direction:column;align-items:center}
h1{font-family:'Dancing Script',cursive,serif;font-weight:600;font-size:2.2rem;margin:22px 0 0;color:#fff;text-shadow:0 2px 12px #a2348a88;text-align:center}
.sub{color:#fff;opacity:.9;font-style:italic;margin:4px 0 0;font-size:.95rem;text-align:center}
.fl{position:fixed;top:105vh;pointer-events:none;animation:up linear infinite;opacity:.6}
@keyframes up{to{transform:translateY(-120vh) rotate(40deg)}}
.stage{position:relative;width:300px;height:480px;margin-top:10px;touch-action:none;user-select:none;-webkit-user-select:none}
.card{position:absolute;inset:0;display:flex;justify-content:center;padding-top:160px;opacity:0;pointer-events:none;transform:translateY(60px) scale(.9);transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .4s}.card.drag{transition:none}
.card.active{opacity:1;pointer-events:auto;transform:none}
.card.prev{transform:translateY(-60px) scale(.9)}
.env{position:relative;width:280px;height:190px;filter:drop-shadow(0 12px 18px #5a2a6e55)}
.back,.front,.flap{position:absolute;inset:0}
.back{background:var(--env2);border-radius:8px}
.letter{position:absolute;left:12px;right:12px;top:10px;height:168px;overflow:hidden;background:repeating-linear-gradient(transparent 0 27px,#e9b8ff44 27px 28px),var(--paper);border-radius:6px;z-index:2;padding:16px 14px;text-align:center;color:var(--ink);transition:transform .9s .35s cubic-bezier(.3,1.2,.4,1),height .9s .35s;box-shadow:0 0 0 3px var(--env) inset}
.letter h2{font-family:'Dancing Script',cursive,serif;margin:0 0 6px;font-size:1.6rem;color:var(--accent)}
.letter p{margin:0;font-size:.95rem;line-height:1.45;font-style:italic}
.letter .pic{display:block;width:96px;height:96px;object-fit:cover;border-radius:10px;margin:8px auto 0;box-shadow:0 2px 8px #5a2a6e44}
.big.open .letter{transform:translateY(-110px);height:352px;z-index:5}
.big .letter h2{font-size:1.35rem;line-height:1.15}
.big .letter p{font-size:.88rem;line-height:1.4}
.big .letter .pic.png{max-height:112px}
.letter .pic.png{width:auto;height:auto;max-width:100%;border-radius:0;box-shadow:none;object-fit:contain}
.pg{position:relative}
.letter img{-webkit-user-drag:none;user-select:none;pointer-events:none}
.big .pg{height:320px;overflow:hidden}
.slide{will-change:transform}
.big .letter .pic.png{max-height:100px}
.pg2{display:flex;flex-direction:column;align-items:center;justify-content:center}
.letter .pic.wide{width:210px;height:auto;max-height:150px;object-fit:cover;margin:0 auto 12px}
.up{position:absolute;left:0;right:0;bottom:20px;font:.68rem/1.2 'Playfair Display',Georgia,serif;font-style:normal;opacity:.65;animation:bob 1.4s ease-in-out infinite}
.up.dn{animation:none;opacity:.5}
@keyframes bob{50%{transform:translateY(-4px)}}
.letter canvas{width:128px;height:128px;image-rendering:pixelated;display:block;margin:2px auto 4px}
.front{background:var(--env);border-radius:8px;z-index:3;clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%)}
.flap{background:linear-gradient(color-mix(in srgb,var(--env) 65%,#fff),var(--env));z-index:4;clip-path:polygon(0 0,100% 0,50% 60%);transform-origin:top;transition:transform .5s,z-index 0s .25s;border-radius:8px 8px 0 0}
.brooch{position:absolute;left:50%;top:114px;width:56px;height:52px;margin:-26px 0 0 -28px;border:0;padding:0;clip-path:path('M28 48C8 34 2 24 2 15 2 7 8 2 15 2 21 2 26 5 28 10 30 5 35 2 41 2 48 2 54 7 54 15 54 24 48 34 28 48Z');z-index:6;cursor:pointer;background:radial-gradient(circle at 35% 30%,#fff 0,#ffb3dc 18%,var(--accent) 60%,#7a1f6a);animation:pulse 1.6s infinite;transition:.4s}
.brooch::after{content:"M";color:#fff;font:600 24px/44px 'Dancing Script',cursive,serif;text-shadow:0 1px 4px #0006}
@keyframes pulse{25%{transform:scale(1.08) rotate(-8deg)}75%{transform:scale(1.08) rotate(8deg)}50%{transform:scale(1.12);box-shadow:0 0 0 4px #fff8,0 0 0 11px #c2358f66,0 4px 10px #0005}}
.hint{position:absolute;left:0;right:0;top:160px;text-align:center;color:#fff;font-size:.8rem;z-index:6;pointer-events:none;transition:.3s}
.open .flap{transform:rotateX(180deg);z-index:1}
.open .letter{transform:translateY(-150px);height:244px}
.open .brooch{transform:scale(0) rotate(180deg);opacity:0;pointer-events:none;animation:none}
.open .hint{opacity:0}
.cf{position:absolute;left:50%;top:114px;width:8px;height:12px;border-radius:2px;z-index:7;pointer-events:none;animation:pop 1.1s ease-out forwards}@keyframes pop{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.rose{position:fixed;width:112px;height:112px;pointer-events:none;--r:0deg;transform:rotate(var(--r));animation:sway 1.4s steps(1) infinite;shape-rendering:crispEdges}
.rose.tr{top:6px;right:-10px;--r:0deg}.rose.bl{bottom:-14px;left:-10px;--r:0deg;animation-delay:-.7s}
@keyframes sway{50%{transform:rotate(var(--r)) translateY(-4px)}}
.nav{display:flex;align-items:center;gap:14px;margin-top:8px;margin-bottom:30px}
.nav button{width:44px;height:44px;border-radius:50%;border:0;background:var(--nav);color:#fff;font-size:20px;cursor:pointer;backdrop-filter:blur(4px)}
.nav button:disabled{opacity:.35}
.dots{display:flex;gap:8px}.dots i{width:10px;height:10px;border-radius:50%;background:#fff6;transition:.3s}.dots i.on{background:#fff;transform:scale(1.35)}
</style>
</head>

const st=document.getElementById('stage'),dots=document.getElementById('dots');
st.innerHTML=C.map((c,i)=>`<div class="card" style="--env:${E[i][0]};--env2:${E[i][1]};--accent:${E[i][2]}"><div class="env"><div class="back"></div><div class="letter"><div class="slide"><div class="pg"><h2>${c[0]}</h2>${c[2]==1?'<canvas width="32" height="32"></canvas>':''}<p>${c[1]}</p>${c[3]?'<img class="pic'+(c[3].indexOf('data:image/png')==0?' png':'')+'" src="'+c[3]+'" alt="">':''}${c[4]?'<div class="up">▲<br>puxe pra cima</div>':''}</div>${c[4]?'<div class="pg pg2"><img class="pic wide" src="'+c[5]+'" alt=""><p>'+c[4]+'</p><div class="up dn">▼ puxe pra baixo pra voltar</div></div>':''}</div></div><div class="front"></div><div class="flap"></div><button class="brooch" aria-label="Abrir carta ${i+1}"></button><div class="hint">toque no broche</div></div></div>`).join('');

const cards=[...st.children],ds=[...dots.children];
cards[C.length-1].classList.add('big');
const L5=cards[C.length-1].querySelector('.letter'),SL=L5.querySelector('.slide'),H5=320;
let so=0,sy=0,sd=false,sm=false,sdy=0;
function setSlide(o,an){so=o;SL.style.transition=an===false?'none':'transform .5s cubic-bezier(.2,.8,.2,1)';SL.style.transform='translateY('+(-o)+'px)'}
L5.addEventListener('pointerdown',e=>{if(!cards[C.length-1].classList.contains('open'))return;e.stopPropagation();sd=true;sm=false;sy=e.clientY;sdy=0;L5.setPointerCapture(e.pointerId)});
L5.addEventListener('pointermove',e=>{if(!sd)return;sdy=e.clientY-sy;if(Math.abs(sdy)>6)sm=true;if(sm){const o=Math.max(0,Math.min(H5,so-sdy));SL.style.transition='none';SL.style.transform='translateY('+(-o)+'px)'}});
const se=()=>{if(!sd)return;sd=false;if(!sm)return;setSlide(sdy<-40?H5:sdy>40?0:so)};
L5.addEventListener('pointerup',se);L5.addEventListener('pointercancel',se);

function layout(dy){cards.forEach((c,i)=>{const o=(i-cur)*430+dy,a=Math.min(Math.abs(o)/430,1);c.style.transform=`translateY(${o}px) scale(${1-a*.1})`;c.style.opacity=Math.max(0,1-a*1.4)})}
function go(n){cur=Math.max(0,Math.min(C.length-1,n));cancelAnimationFrame(raf);draw(0);
setSlide(0,false);
cards.forEach((c,i)=>{c.classList.toggle('active',i==cur);c.classList.toggle('prev',i<cur);c.classList.remove('open')});layout(0);
ds.forEach((d,i)=>d.classList.toggle('on',i==cur));pv.disabled=cur==0;nx.disabled=cur==C.length-1}
function confetti(env){const cols=['#ff5fa8','#b78cff','#ffd24d','#6fd3ff','#7be0a8','#fff'];for(let i=0;i<26;i++){const s=document.createElement('i');s.className='cf';const a=Math.random()*Math.PI*2,d=70+Math.random()*90;s.style.cssText=`background:${cols[i%6]};--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d-60}px;--r:${Math.random()*720}deg`;env.appendChild(s);setTimeout(()=>s.remove(),1200)}}
cards.forEach((c,i)=>c.querySelector('.brooch').onclick=()=>{c.classList.add('open');confetti(c.querySelector('.env'));if(i==4)reveal()});
pv.onclick=()=>go(cur-1);nx.onclick=()=>go(cur+1);
let y0=0,dy=0,t0=0,down=false,moved=false;
st.addEventListener('pointerdown',e=>{down=true;moved=false;y0=e.clientY;dy=0;t0=Date.now()});
st.addEventListener('pointermove',e=>{if(!down)return;dy=e.clientY-y0;if(!moved&&Math.abs(dy)>8){moved=true;st.setPointerCapture(e.pointerId);cards.forEach(c=>c.classList.add('drag'))}if(moved){const r=(dy>0&&cur==0)||(dy<0&&cur==C.length-1)?.3:1;layout(dy*r)}});
const end=()=>{if(!down)return;down=false;if(!moved)return;cards.forEach(c=>c.classList.remove('drag'));const f=Date.now()-t0<300&&Math.abs(dy)>25,n=cur+((dy<-60||(f&&dy<0))?1:(dy>60||(f&&dy>0))?-1:0);n!=cur&&n>=0&&n<C.length?go(n):layout(0)};
st.addEventListener('pointerup',end);st.addEventListener('pointercancel',end);
st.addEventListener('click',e=>{if(moved){e.stopPropagation();e.preventDefault();moved=false}},true);
for(let i=0;i<14;i++){const s=document.createElement('span');s.className='fl';s.textContent=i%2?'♡':'✿';s.style.cssText=`left:${Math.random()*100}vw;font-size:${14+Math.random()*18}px;color:${['#fff','#e9b8ff','#ffe28a','#aeeaff'][i%4]};animation-duration:${9+Math.random()*10}s;animation-delay:${-Math.random()*15}s`;document.body.appendChild(s)}
const RR=['......RRR.......','.....RRdRR......','.RRR.RdrdR......','RRdRR.RRR..RRR..','RdrdR..g..RRdRR.','.RRR...g..RdrdR.','..g....gGG.RRR..','...g...g....g...','....g..g...g....','.....g.g..g.....','......gg.g......','.......gg.......','.....bbBBbb.....','....bb.gg.bb....','....b..gg..b....','.......gg.......'],RP={R:'#d62839',r:'#ff5a6e',d:'#7a1030',g:'#3fae6a',G:'#58c986',b:'#ff5fa8',B:'#c2358f'};
let rs='';RR.forEach((r,y)=>[...r].forEach((c,x)=>{if(RP[c])rs+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${RP[c]}"/>`}));document.getElementById('rs').innerHTML=rs;
go(0);
</script>
</body>
</html>
